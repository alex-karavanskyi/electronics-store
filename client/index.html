<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Keep the storage key and mode validation in sync with ThemeProvider.
      ;(() => {
        let mode = 'system'
        try {
          const stored = localStorage.getItem('volt_theme')
          if (stored === 'light' || stored === 'dark') mode = stored
        } catch {
          // Use the OS preference when storage is unavailable.
        }
        const theme =
          mode === 'system'
            ? window.matchMedia?.('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta
      name="description"
      content="A curated selection of technology for work, home and entertainment."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>VOLT ? Technology for everyday life</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
